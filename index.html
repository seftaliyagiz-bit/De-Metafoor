<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café De Metafoor — Leuven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #1a0f0a; font-family: 'DM Sans', sans-serif; }

    @keyframes grainMove {
      0%   { transform: translate(0,0); }
      20%  { transform: translate(-2px,2px); }
      40%  { transform: translate(2px,-2px); }
      60%  { transform: translate(-1px,3px); }
      80%  { transform: translate(3px,-1px); }
      100% { transform: translate(0,0); }
    }
    @keyframes pulseGlow {
      0%,100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    @keyframes borderDraw {
      from { stroke-dashoffset: 600; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-8px) rotate(-1deg); }
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── responsive helpers ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
    }
    @media (max-width: 768px) {
      .two-col { grid-template-columns: 1fr !important; gap: 48px !important; }
      .section-pad { padding: 72px 24px !important; }
      .gallery-grid {
        grid-template-columns: 1fr 1fr !important;
        grid-template-rows: 180px 180px 180px !important;
      }
      .gallery-wide { grid-column: span 2 !important; }
      .gallery-tall { grid-row: span 1 !important; }
      .hero-mug { display: none !important; }
      .nav-links { display: none !important; }
      .footer-row { flex-direction: column !important; gap: 12px !important; align-items: flex-start !important; }
      .contact-map iframe { height: 160px !important; }
    }
    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: 1fr !important;
        grid-template-rows: repeat(6, 200px) !important;
      }
      .gallery-wide { grid-column: span 1 !important; }
      .two-col { gap: 36px !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

/* ─── tokens ─────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "tagline": "Gezelligheid in het hart van Leuven",
  "ctaLabel": "Ontdek ons menu",
  "bgTone": "brown",
  "accentHue": 55,
  "showHours": true,
  "grainIntensity": "medium"
} /*EDITMODE-END*/;

const GRAIN_OPQ = { light: 0.025, medium: 0.048, heavy: 0.08 };

const BG_COLORS = {
  brown: ['#1a0f0a', '#2d1a0f', '#3d2410'],
  espresso: ['#0e0b08', '#1e1510', '#2e1e14'],
  slate: ['#0c1118', '#16202e', '#1e2d3f']
};

function useIsMobile() {
  const [mobile, setMobile] = useState(() => window.innerWidth <= 768);
  useEffect(() => {
    const fn = () => setMobile(window.innerWidth <= 768);
    window.addEventListener('resize', fn, { passive: true });
    return () => window.removeEventListener('resize', fn);
  }, []);
  return mobile;
}

/* ─── shared helpers ─────────────────────────────────────────── */
function useInView(threshold = 0.18) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => {if (e.isIntersecting) setVis(true);}, { threshold });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, vis];
}

function fadeUp(vis, delay = 0) {
  return {
    opacity: vis ? 1 : 0,
    transform: vis ? 'translateY(0)' : 'translateY(32px)',
    transition: `opacity 0.75s ease ${delay}s, transform 0.75s ease ${delay}s`
  };
}

function Grain({ intensity }) {
  return (
    <div style={{
      position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 10,
      backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E")`,
      backgroundSize: '180px 180px',
      opacity: GRAIN_OPQ[intensity] ?? 0.048,
      mixBlendMode: 'overlay',
      animation: 'grainMove 0.12s steps(1) infinite'
    }} />);

}

function SectionLabel({ accent, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
      <div style={{ width: 28, height: 1, background: `oklch(0.62 0.15 ${accent} / 0.55)` }} />
      <span style={{
        fontFamily: "'DM Sans',sans-serif", fontWeight: 400, fontSize: 11,
        letterSpacing: '0.22em', textTransform: 'uppercase',
        color: `oklch(0.62 0.15 ${accent})`
      }}>{children}</span>
    </div>);

}

function Divider({ accent }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 14, margin: '0 auto', width: '100%', maxWidth: 120, justifyContent: 'center' }}>
      <div style={{ height: 1, flex: 1, background: `oklch(0.65 0.04 75 / 0.25)` }} />
      <svg width="10" height="10" viewBox="0 0 10 10">
        <rect x="1" y="1" width="8" height="8" rx="1"
        stroke={`oklch(0.62 0.15 ${accent} / 0.6)`} strokeWidth="1" fill="none"
        transform="rotate(45 5 5)" />
      </svg>
      <div style={{ height: 1, flex: 1, background: `oklch(0.65 0.04 75 / 0.25)` }} />
    </div>);

}

/* ─── NAV ────────────────────────────────────────────────────── */
function Nav({ accent }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const mobile = useIsMobile();
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const links = [
  { href: '#over-ons', label: 'Over ons' },
  { href: '#openingsuren', label: 'Uren' },
  { href: '#galerij', label: 'Galerij' },
  { href: '#contact', label: 'Contact' }];

  const navBg = scrolled || menuOpen ? 'oklch(0.11 0.025 50 / 0.96)' : 'transparent';
  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      padding: '0 24px',
      background: navBg,
      backdropFilter: scrolled || menuOpen ? 'blur(14px)' : 'none',
      borderBottom: scrolled ? '1px solid oklch(0.65 0.04 75 / 0.1)' : 'none',
      transition: 'background 0.4s, border-color 0.4s'
    }}>
      <div style={{ height: 60, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{
          fontFamily: "'Playfair Display',serif", fontStyle: 'italic', fontWeight: 700,
          fontSize: 20, color: `oklch(0.62 0.15 ${accent})`, letterSpacing: '-0.01em'
        }}>De Metafoor</span>
        {!mobile &&
        <div style={{ display: 'flex', gap: 32 }}>
            {links.map((l) =>
          <a key={l.href} href={l.href} style={{
            fontFamily: "'DM Sans',sans-serif", fontWeight: 400, fontSize: 13,
            letterSpacing: '0.08em', textTransform: 'uppercase',
            color: 'oklch(0.72 0.03 75)', textDecoration: 'none', transition: 'color 0.2s'
          }}
          onMouseEnter={(e) => e.target.style.color = `oklch(0.62 0.15 ${accent})`}
          onMouseLeave={(e) => e.target.style.color = 'oklch(0.72 0.03 75)'}>
            {l.label}</a>
          )}
          </div>
        }
        {mobile &&
        <button onClick={() => setMenuOpen((o) => !o)} style={{
          background: 'none', border: 'none', cursor: 'pointer', padding: 8,
          display: 'flex', flexDirection: 'column', gap: 5
        }}>
            {[0, 1, 2].map((i) =>
          <div key={i} style={{
            width: 22, height: 2, background: 'oklch(0.72 0.03 75)',
            transition: 'transform 0.25s, opacity 0.25s',
            transform: menuOpen ?
            i === 0 ? 'rotate(45deg) translate(5px,5px)' :
            i === 2 ? 'rotate(-45deg) translate(5px,-5px)' :
            'scaleX(0)' :
            'none',
            opacity: menuOpen && i === 1 ? 0 : 1
          }} />
          )}
          </button>
        }
      </div>
      {mobile && menuOpen &&
      <div style={{ paddingBottom: 16, display: 'flex', flexDirection: 'column', gap: 0 }}>
          {links.map((l) =>
        <a key={l.href} href={l.href} onClick={() => setMenuOpen(false)} style={{
          fontFamily: "'DM Sans',sans-serif", fontWeight: 400, fontSize: 15,
          letterSpacing: '0.06em', textTransform: 'uppercase',
          color: 'oklch(0.72 0.03 75)', textDecoration: 'none',
          padding: '14px 4px',
          borderBottom: '1px solid oklch(0.65 0.04 75 / 0.1)'
        }}>{l.label}</a>
        )}
        </div>
      }
    </nav>);

}

/* ─── HERO ───────────────────────────────────────────────────── */
function Hero({ tweaks }) {
  const [hov, setHov] = useState(false);
  const [mounted, setMounted] = useState(false);
  useEffect(() => {const t = setTimeout(() => setMounted(true), 60);return () => clearTimeout(t);}, []);

  const hue = tweaks.accentHue;
  const accent = `oklch(0.62 0.15 ${hue})`;
  const accentDim = `oklch(0.62 0.15 ${hue} / 0.18)`;
  const accentMid = `oklch(0.62 0.15 ${hue} / 0.55)`;
  const accentGlow = `oklch(0.62 0.15 ${hue} / 0.40)`;
  const [bg1, bg2, bg3] = BG_COLORS[tweaks.bgTone] || BG_COLORS.brown;

  const d = (s) => ({
    opacity: mounted ? 1 : 0,
    transform: mounted ? 'translateY(0)' : 'translateY(28px)',
    transition: `opacity 0.8s ease ${s}s, transform 0.8s ease ${s}s`
  });

  return (
    <section id="hero" data-screen-label="Hero" style={{
      position: 'relative', width: '100%', minHeight: '100vh',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      overflow: 'hidden',
      background: `radial-gradient(ellipse 80% 60% at 50% 40%, ${bg3} 0%, ${bg2} 45%, ${bg1} 100%)`
    }}>
      {/* Hero background photo */}
      <div style={{ position: 'absolute', inset: 0, zIndex: 0,
        backgroundImage: `url('uploads/Screenshot 2026-05-02 at 14.11.19.png')`,
        backgroundSize: 'cover', backgroundPosition: 'center 60%',
        opacity: 0.38, filter: 'saturate(0.7)' }} />
      {/* Dark gradient overlay for text readability */}
      <div style={{ position: 'absolute', inset: 0, zIndex: 1,
        background: `linear-gradient(to bottom, oklch(0 0 0 / 0.55) 0%, oklch(0 0 0 / 0.35) 50%, oklch(0 0 0 / 0.65) 100%)` }} />
      <div style={{ position: 'absolute', top: '8%', left: '12%', width: 420, height: 320,
        borderRadius: '60% 40% 70% 30% / 50% 60% 40% 50%',
        background: `radial-gradient(ellipse, oklch(0.45 0.08 50 / 0.18) 0%, transparent 70%)`,
        filter: 'blur(48px)', pointerEvents: 'none', zIndex: 2 }} />
      <div style={{ position: 'absolute', bottom: '10%', right: '8%', width: 360, height: 280,
        borderRadius: '40% 60% 30% 70% / 60% 40% 60% 40%',
        background: `radial-gradient(ellipse, ${accentDim} 0%, transparent 70%)`,
        filter: 'blur(56px)', pointerEvents: 'none', animation: 'pulseGlow 4s ease-in-out infinite', zIndex: 2 }} />
      <Grain intensity={tweaks.grainIntensity} />

      <div style={{ position: 'relative', zIndex: 5, display: 'flex', flexDirection: 'column',
        alignItems: 'center', textAlign: 'center', padding: '80px 40px', maxWidth: 720 }}>
        {/* decorative border */}
        <svg viewBox="0 0 520 320" fill="none" style={{
          position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%,-50%)',
          width: '90%', maxWidth: 560, opacity: 0.18, pointerEvents: 'none', zIndex: 2
        }}>
          <rect x="8" y="8" width="504" height="304" rx="2"
          stroke="oklch(0.85 0.05 80)" strokeWidth="1"
          strokeDasharray="600" strokeDashoffset="600"
          style={{ animation: 'borderDraw 2.2s ease forwards 0.6s' }} />
          <rect x="16" y="16" width="488" height="288" rx="1"
          stroke="oklch(0.85 0.05 80)" strokeWidth="0.5"
          strokeDasharray="600" strokeDashoffset="600"
          style={{ animation: 'borderDraw 2.4s ease forwards 0.9s' }} />
          {[[8, 8], [512, 8], [8, 312], [512, 312]].map(([cx, cy], i) =>
          <circle key={i} cx={cx} cy={cy} r="3" fill="oklch(0.85 0.05 80)"
          style={{ opacity: 0, animation: `fadeIn 0.4s ease forwards ${1.2 + i * 0.1}s` }} />
          )}
        </svg>

        <div style={{ ...d(0.1), display: 'flex', alignItems: 'center', gap: 10, marginBottom: 28 }}>
          <div style={{ width: 32, height: 1, background: accentMid }} />
          <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 400, fontSize: 11,
            letterSpacing: '0.22em', color: accent, textTransform: 'uppercase' }}>Est. in Leuven</span>
          <div style={{ width: 32, height: 1, background: accentMid }} />
        </div>

        <h1 style={{ ...d(0.25), fontFamily: "'Playfair Display',Georgia,serif", fontWeight: 900,
          fontSize: 'clamp(56px,10vw,108px)', lineHeight: 0.92, letterSpacing: '-0.02em',
          color: 'oklch(0.94 0.025 75)', position: 'relative', zIndex: 3, textWrap: 'balance' }}>
          <span style={{ fontStyle: 'italic', color: accent, display: 'inline-block',
            textShadow: `0 0 60px ${accentGlow}` }}>De Metafoor</span>
        </h1>

        <div style={{ ...d(0.4), display: 'flex', alignItems: 'center', gap: 14,
          margin: '28px 0', justifyContent: 'center', zIndex: 3, position: 'relative' }}>
          <div style={{ height: 1, flex: 1, maxWidth: 80,
            background: `linear-gradient(to right, transparent, oklch(0.65 0.04 75 / 0.4))` }} />
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="6" stroke={accent} strokeWidth="1.2" fill="none" />
            <circle cx="7" cy="7" r="2.5" fill={accent} opacity="0.6" />
            {[[7, 1, 7, 3.5], [7, 10.5, 7, 13], [1, 7, 3.5, 7], [10.5, 7, 13, 7]].map(([x1, y1, x2, y2], i) =>
            <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={accent} strokeWidth="1" />
            )}
          </svg>
          <div style={{ height: 1, flex: 1, maxWidth: 80,
            background: `linear-gradient(to left, transparent, oklch(0.65 0.04 75 / 0.4))` }} />
        </div>

        <p style={{ ...d(0.5), fontFamily: "'Playfair Display',Georgia,serif", fontStyle: 'italic',
          fontWeight: 400, fontSize: 'clamp(17px,2.4vw,22px)', lineHeight: 1.6,
          color: 'oklch(0.78 0.03 75)', maxWidth: 420, position: 'relative', zIndex: 3,
          textWrap: 'pretty', marginBottom: tweaks.showHours ? 16 : 36 }}>
          "{tweaks.tagline}"
        </p>

        {tweaks.showHours &&
        <div style={{ ...d(0.6), display: 'flex', alignItems: 'center', gap: 8, marginBottom: 36,
          padding: '6px 16px', borderRadius: 99,
          border: '1px solid oklch(0.65 0.04 75 / 0.2)',
          background: 'oklch(0.94 0.025 75 / 0.04)', position: 'relative', zIndex: 3 }}>
            <div style={{ width: 6, height: 6, borderRadius: '50%', background: accent,
            boxShadow: `0 0 8px ${accentGlow}`, animation: 'pulseGlow 2s ease-in-out infinite' }} />
            <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 300, fontSize: 12,
            letterSpacing: '0.06em', color: 'oklch(0.65 0.03 75)' }}>
              Vandaag open · 12:00 – 02:00
            </span>
          </div>
        }

        <button onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
        onClick={() => document.getElementById('over-ons')?.scrollIntoView({ behavior: 'smooth' })}
        style={{ ...d(0.7), position: 'relative', zIndex: 3,
          fontFamily: "'DM Sans',sans-serif", fontWeight: 500, fontSize: 14,
          letterSpacing: '0.14em', textTransform: 'uppercase',
          color: hov ? bg1 : accent,
          background: hov ? accent : 'transparent',
          border: `1.5px solid ${accent}`, padding: '16px 44px', borderRadius: 2,
          cursor: 'pointer', transition: 'all 0.28s ease', outline: 'none',
          boxShadow: hov ? `0 8px 40px ${accentGlow}` : `0 0 24px oklch(0.62 0.15 ${hue} / 0.1)`
        }}>
          {tweaks.ctaLabel}
          <span style={{ display: 'inline-block', marginLeft: 10,
            transition: 'transform 0.28s ease', transform: hov ? 'translateX(4px)' : 'translateX(0)' }}>→</span>
        </button>

        <div style={{ ...d(0.85), marginTop: 48, display: 'flex', alignItems: 'center',
          gap: 8, position: 'relative', zIndex: 3 }}>
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none">
            <path d="M6 0C3.24 0 1 2.24 1 5c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5Z"
            fill={`oklch(0.62 0.15 ${hue} / 0.6)`} />
            <circle cx="6" cy="5" r="1.8" fill={bg2} />
          </svg>
          <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 300, fontSize: 12,
            letterSpacing: '0.1em', color: 'oklch(0.50 0.03 75)', textTransform: 'uppercase' }}>
            Naamsestraat · Leuven
          </span>
        </div>
      </div>

      {/* floating mug */}
      <div style={{ position: 'absolute', right: '6%', top: '50%', transform: 'translateY(-50%)',
        opacity: 0.055, pointerEvents: 'none', zIndex: 1, animation: 'float 6s ease-in-out infinite' }}>
        <svg width="160" height="200" viewBox="0 0 160 200" fill="none">
          <rect x="20" y="30" width="100" height="130" rx="8" fill="oklch(0.85 0.05 80)" />
          <path d="M120 70 Q150 70 150 100 Q150 130 120 130"
          stroke="oklch(0.85 0.05 80)" strokeWidth="14" fill="none" strokeLinecap="round" />
          <rect x="20" y="20" width="100" height="16" rx="4" fill="oklch(0.85 0.05 80)" opacity="0.6" />
          {[50, 70, 90].map((x, i) =>
          <path key={i} d={`M${x} 15 Q${x + 4} 5 ${x} -5`}
          stroke="oklch(0.85 0.05 80)" strokeWidth="3" fill="none" strokeLinecap="round" opacity="0.5" />
          )}
        </svg>
      </div>

      {/* scroll cue */}
      <div style={{ position: 'absolute', bottom: 32, left: '50%', transform: 'translateX(-50%)',
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, opacity: 0.35, zIndex: 5,
        animation: 'pulseGlow 2.5s ease-in-out infinite' }}>
        <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10,
          letterSpacing: '0.18em', textTransform: 'uppercase', color: 'oklch(0.65 0.03 75)' }}>Scroll</span>
        <svg width="16" height="24" viewBox="0 0 16 24" fill="none">
          <rect x="1" y="1" width="14" height="22" rx="7" stroke="oklch(0.65 0.03 75)" strokeWidth="1.2" />
          <circle cx="8" cy="7" r="2.5" fill="oklch(0.65 0.03 75)">
            <animate attributeName="cy" values="7;15;7" dur="1.8s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
          </circle>
        </svg>
      </div>
    </section>);

}

/* ─── OVER ONS ───────────────────────────────────────────────── */
function OverOns({ accent }) {
  const [ref, vis] = useInView();
  const mobile = useIsMobile();
  const hue = accent;

  const pillars = [
  { label: 'Sfeer', body: 'Elke avond anders, altijd thuis. Dimme lichten, houten tafels, vrienden die te lang blijven.' },
  { label: 'Bier', body: 'Een zorgvuldig samengestelde kaart van Belgische ambachtsbieren — van geuze tot tripel.' },
  { label: 'Muziek', body: 'Jazz op dinsdag, vinylnachten op vrijdag. Geen algorithms, alleen kuratoren.' }];


  return (
    <section id="over-ons" data-screen-label="Over Ons" style={{
      position: 'relative',
      background: '#1e1208',
      overflow: 'hidden',
      padding: mobile ? '72px 24px' : '120px 40px'
    }}>
      {/* background texture stripe */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, opacity: 0.04,
        backgroundImage: `repeating-linear-gradient(
          -45deg,
          oklch(0.85 0.04 75) 0px,
          oklch(0.85 0.04 75) 1px,
          transparent 1px,
          transparent 28px
        )`, pointerEvents: 'none' }} />

      <div ref={ref} className="two-col" style={{ maxWidth: 1100, margin: '0 auto', alignItems: 'start' }}>

        {/* left: text */}
        <div>
          <div style={fadeUp(vis, 0)}>
            <SectionLabel accent={hue}>Over Ons</SectionLabel>
          </div>
          <h2 style={{ ...fadeUp(vis, 0.1),
            fontFamily: "'Playfair Display',serif", fontWeight: 700,

                value={form[f.key]}
                onChange={(e) => setForm((p) => ({ ...p, [f.key]: e.target.value }))}
                onFocus={(e) => e.target.style.borderColor = `oklch(0.62 0.15 ${hue} / 0.6)`}
                onBlur={(e) => e.target.style.borderColor = 'oklch(0.65 0.04 75 / 0.18)'}
                style={inputStyle} />
                </div>
            )}
              <div>
                <label style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 400, fontSize: 11,
                letterSpacing: '0.14em', textTransform: 'uppercase',
                color: 'oklch(0.55 0.03 75)', display: 'block', marginBottom: 6 }}>Bericht</label>
                <textarea
                placeholder="Jouw bericht..." required rows={5}
                value={form.bericht}
                onChange={(e) => setForm((p) => ({ ...p, bericht: e.target.value }))}
                onFocus={(e) => e.target.style.borderColor = `oklch(0.62 0.15 ${hue} / 0.6)`}
                onBlur={(e) => e.target.style.borderColor = 'oklch(0.65 0.04 75 / 0.18)'}
                style={{ ...inputStyle, resize: 'vertical' }} />
              </div>
              <button type="submit" style={{
              marginTop: 8, padding: '16px 32px', alignSelf: 'flex-start',
              fontFamily: "'DM Sans',sans-serif", fontWeight: 500, fontSize: 13,
              letterSpacing: '0.14em', textTransform: 'uppercase',
              color: '#1a0f0a',
              background: `oklch(0.62 0.15 ${hue})`,
              border: 'none', borderRadius: 2, cursor: 'pointer',
              transition: 'opacity 0.2s, transform 0.2s',
              boxShadow: `0 8px 32px oklch(0.62 0.15 ${hue} / 0.35)`
            }}
            onMouseEnter={(e) => {e.target.style.opacity = '0.85';e.target.style.transform = 'translateY(-1px)';}}
            onMouseLeave={(e) => {e.target.style.opacity = '1';e.target.style.transform = 'translateY(0)';}}>
                Verstuur bericht →
              </button>
            </form>
          }
        </div>
      </div>
    </section>);

}

/* ─── FOOTER ─────────────────────────────────────────────────── */
function Footer({ accent }) {
  const hue = accent;
  const mobile = useIsMobile();
  return (
    <footer style={{ padding: '40px 24px 32px',
      background: '#120a05',
      borderTop: '1px solid oklch(0.65 0.04 75 / 0.08)',
      display: 'flex',
      flexDirection: mobile ? 'column' : 'row',
      justifyContent: 'space-between', alignItems: mobile ? 'flex-start' : 'center',
      flexWrap: 'wrap', gap: mobile ? 12 : 16 }}>
      <div style={{ fontFamily: "'Playfair Display',serif", fontStyle: 'italic',
        fontWeight: 700, fontSize: 18, color: `oklch(0.62 0.15 ${hue} / 0.7)` }}>
        Café De Metafoor
      </div>
      <div style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 300, fontSize: 12,
        letterSpacing: '0.08em', color: 'oklch(0.38 0.02 75)' }}>
        © 2026 · Parijsstraat 34 · 3000 Leuven
      </div>
      <div style={{ display: 'flex', gap: 20 }}>
        {[
        { label: 'Facebook', href: 'https://www.facebook.com/pages/Metafoor/135530549837877' },
        { label: 'Instagram', href: null },
        { label: 'TripAdvisor', href: 'https://www.tripadvisor.nl/Restaurant_Review-g188669-d3599522-Reviews-Metafoor-Leuven_Flemish_Brabant_Province.html' }].
        map((s) =>
        s.href ?
        <a key={s.label} href={s.href} target="_blank" rel="noopener noreferrer"
        style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 300, fontSize: 12,
          letterSpacing: '0.08em', color: 'oklch(0.45 0.02 75)', cursor: 'pointer',
          textDecoration: 'none', transition: 'color 0.2s' }}
        onMouseEnter={(e) => e.target.style.color = `oklch(0.62 0.15 ${hue})`}
        onMouseLeave={(e) => e.target.style.color = 'oklch(0.45 0.02 75)'}>
          {s.label}</a> :
        <span key={s.label} style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 300, fontSize: 12,
          letterSpacing: '0.08em', color: 'oklch(0.45 0.02 75)', cursor: 'pointer',
          transition: 'color 0.2s' }}
        onMouseEnter={(e) => e.target.style.color = `oklch(0.62 0.15 ${hue})`}
        onMouseLeave={(e) => e.target.style.color = 'oklch(0.45 0.02 75)'}>
          {s.label}</span>
        )}
      </div>
    </footer>);

}

/* ─── APP ────────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const hue = tweaks.accentHue;

  return (
    <>
      <Nav accent={hue} />
      <Hero tweaks={tweaks} />
      <OverOns accent={hue} />
      <Openingsuren accent={hue} />
      <Gallery accent={hue} />
      <Contact accent={hue} />
      <Footer accent={hue} />

      <TweaksPanel>
        <TweakSection label="Tekst">
          <TweakText id="tagline" label="Tagline" value={tweaks.tagline} onChange={(v) => setTweak('tagline', v)} />
          <TweakText id="ctaLabel" label="CTA knop" value={tweaks.ctaLabel} onChange={(v) => setTweak('ctaLabel', v)} />
        </TweakSection>
        <TweakSection label="Visueel">
          <TweakRadio id="bgTone" label="Achtergrond"
          options={[{ value: 'brown', label: 'Bruin' }, { value: 'espresso', label: 'Espresso' }, { value: 'slate', label: 'Leisteen' }]}
          value={tweaks.bgTone} onChange={(v) => setTweak('bgTone', v)} />
          <TweakSlider id="accentHue" label="Accentkleur" min={20} max={220} step={2}
          value={tweaks.accentHue} onChange={(v) => setTweak('accentHue', v)} />
          <TweakRadio id="grainIntensity" label="Korrel"
          options={[{ value: 'light', label: 'Licht' }, { value: 'medium', label: 'Midden' }, { value: 'heavy', label: 'Zwaar' }]}
          value={tweaks.grainIntensity} onChange={(v) => setTweak('grainIntensity', v)} />
        </TweakSection>
        <TweakSection label="Details">
          <TweakToggle id="showHours" label="Openingstijden tonen"
          value={tweaks.showHours} onChange={(v) => setTweak('showHours', v)} />
        </TweakSection>
      </TweaksPanel>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
